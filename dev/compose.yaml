# Alleen voor lokale ontwikkeling buiten Kubernetes (make dev-up).
# De echte installatie in het kind-cluster gebruikt deploy/scripts/install.sh met mTLS en gegenereerde secrets.
name: banksim-dev

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: banksim
      POSTGRES_PASSWORD: ${BANKSIM_DEV_DB_PASSWORD:-banksim-dev}
      POSTGRES_DB: bank
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banksim -d bank"]
      interval: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${BANKSIM_DEV_KC_PASSWORD:-banksim-dev}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: banksim
      KC_DB_PASSWORD: ${BANKSIM_DEV_DB_PASSWORD:-banksim-dev}
      KC_HTTP_PORT: "8080"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:18080:8080"
    healthcheck:
      # De image heeft geen curl; daarom een ruwe HTTP-request via bash naar de management-poort.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
