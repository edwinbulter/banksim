# bank-web: statische Angular-app achter ingress-nginx.
# Alleen ingress-nginx mag aanroepen: TLS met verplicht clientcertificaat van de BankSim-CA en CN "ingress"
# (TO §10.1). Probes gaan naar de aparte health-poort 8081.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /dev/stdout;
    sendfile on;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $ssl_client_s_dn $mtls_toegestaan {
        "CN=ingress" 1;
        default      0;
    }

    server {
        listen 8443 ssl;
        http2 on;

        ssl_certificate        /etc/banksim/tls/tls.crt;
        ssl_certificate_key    /etc/banksim/tls/tls.key;
        ssl_client_certificate /etc/banksim/tls/ca.crt;
        ssl_verify_client      on;
        ssl_protocols          TLSv1.3;

        if ($mtls_toegestaan = 0) {
            return 403;
        }

        root /usr/share/nginx/html;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://auth.localtest.me" always;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /index.html {
            # Nonce per request voor de stijlen van Angular (geen 'unsafe-inline').
            sub_filter_types text/html;
            sub_filter '__CSP_NONCE__' '$request_id';
            sub_filter_once off;
            add_header Cache-Control "no-store" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://auth.localtest.me" always;
        }
    }

    server {
        listen 8081;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 404;
        }
    }
}
