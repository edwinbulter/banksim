spring:
  application:
    name: bank-api
  threads:
    virtual:
      enabled: true
  ssl:
    bundle:
      pem:
        server:
          keystore:
            certificate: file:${BANKSIM_TLS_DIR:/etc/banksim/tls}/tls.crt
            private-key: file:${BANKSIM_TLS_DIR:/etc/banksim/tls}/tls.key
          truststore:
            certificate: file:${BANKSIM_TLS_DIR:/etc/banksim/tls}/ca.crt
  datasource:
    # Authenticatie met clientcertificaat (CN bank-api → databasegebruiker bank_app). Elke query maximaal 5 s.
    url: >-
      jdbc:postgresql://${BANKSIM_DB_HOST:postgres.banksim.svc}:5432/bank?sslmode=verify-full&sslrootcert=${BANKSIM_TLS_DIR:/etc/banksim/tls}/ca.crt&sslcert=${BANKSIM_TLS_DIR:/etc/banksim/tls}/tls.crt&sslkey=${BANKSIM_TLS_DIR:/etc/banksim/tls}/tls.pk8&options=-c%20statement_timeout%3D5000
    username: bank_app
    hikari:
      connection-timeout: 3000
      validation-timeout: 1000
      maximum-pool-size: 10
  flyway:
    enabled: false

server:
  port: 8443
  shutdown: graceful
  ssl:
    bundle: server
    client-auth: need

banksim:
  security:
    issuer: ${BANKSIM_KEYCLOAK_PUBLIC_URL:https://auth.localtest.me}/realms/banksim
    jwk-set-uri: ${BANKSIM_KEYCLOAK_INTERNAL_URL:https://keycloak.banksim.svc:8443}/realms/banksim/protocol/openid-connect/certs
    audience: bank-api
  # Sleutel voor de HMAC van de paginacursor (Secret in Kubernetes)
  cursor-sleutel: ${BANKSIM_CURSOR_SLEUTEL}
  mtls:
    allowed-clients: bank-bff

management:
  server:
    port: 8081
    ssl:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        startup:
          include: db,jwks
        readiness:
          include: readinessState
        liveness:
          include: livenessState
