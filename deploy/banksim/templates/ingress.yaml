{{- $ns := .Release.Namespace }}
{{- define "banksim.backendTls" -}}
# ingress-nginx → backend: HTTPS, certificaat van de backend controleren en zelf het clientcertificaat "ingress" tonen.
nginx.ingress.kubernetes.io/backend-protocol: HTTPS
nginx.ingress.kubernetes.io/proxy-ssl-secret: {{ .ns }}/tls-ingress-client
nginx.ingress.kubernetes.io/proxy-ssl-verify: "on"
nginx.ingress.kubernetes.io/proxy-ssl-verify-depth: "1"
nginx.ingress.kubernetes.io/proxy-ssl-protocols: TLSv1.3
nginx.ingress.kubernetes.io/proxy-ssl-server-name: "on"
nginx.ingress.kubernetes.io/proxy-ssl-name: {{ .service }}.{{ .ns }}.svc
nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bank-web
  labels:
    {{- include "banksim.labels" (dict "root" . "name" "bank-web") | nindent 4 }}
  annotations:
    {{- include "banksim.backendTls" (dict "ns" $ns "service" "bank-web") | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.hosts.bank }}]
      secretName: tls-public
  rules:
    - host: {{ .Values.hosts.bank }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bank-web
                port: { name: https }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bank-bff
  labels:
    {{- include "banksim.labels" (dict "root" . "name" "bank-bff") | nindent 4 }}
  annotations:
    {{- include "banksim.backendTls" (dict "ns" $ns "service" "bank-bff") | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.hosts.bank }}]
      secretName: tls-public
  rules:
    - host: {{ .Values.hosts.bank }}
      http:
        paths:
          {{- range list "/api" "/oauth2" "/login" "/logout" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: bank-bff
                port: { name: https }
          {{- end }}
---
# Alleen de realm banksim en de statische bestanden; de admin-console en /admin blijven onbereikbaar.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  labels:
    {{- include "banksim.labels" (dict "root" . "name" "keycloak") | nindent 4 }}
  annotations:
    {{- include "banksim.backendTls" (dict "ns" $ns "service" "keycloak") | nindent 4 }}
    nginx.ingress.kubernetes.io/proxy-buffer-size: 16k
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.hosts.auth }}]
      secretName: tls-public
  rules:
    - host: {{ .Values.hosts.auth }}
      http:
        paths:
          {{- range list "/realms/banksim" "/resources" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port: { name: https }
          {{- end }}
