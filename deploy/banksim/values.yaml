# Worden door deploy/scripts/install.sh gezet.
imageTag: dev
certsChecksum: ""

# Oude ReplicaSets per Deployment; elke build met een nieuwe image-tag maakt er een (standaard bewaart
# Kubernetes er 10).
revisionHistoryLimit: 3

images:
  api: banksim/bank-api
  bff: banksim/bank-bff
  migrate: banksim/bank-migrate
  datagen: banksim/bank-datagen
  web: banksim/bank-web
  keycloak: quay.io/keycloak/keycloak:26.8.0@sha256:b0f60d489d51c5d113390bdf5461d4c06e6051be026c05549f2e1e10ec352bcc
  postgres: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873

hosts:
  bank: bank.localtest.me
  auth: auth.localtest.me

ingress:
  className: nginx
  # Namespace van de bestaande ingress-nginx; alleen daarvandaan mag verkeer de namespace in.
  namespace: ingress-nginx

network:
  # Bronnen van kubelet-probes (node-IP), gezet door install.sh.
  probeSources: []

# Rate limiting in de BFF (per minuut): inlogpogingen per IP-adres, boekingen per gebruiker.
limiet:
  loginPerMinuut: 10
  boekingenPerMinuut: 20

replicas:
  api: 2
  bff: 2
  web: 2

resources:
  api:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { memory: 512Mi }
  bff:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { memory: 512Mi }
  web:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 64Mi }
  migrate:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 384Mi }
  datagen:
    requests: { cpu: 500m, memory: 512Mi }
    limits: { memory: 1Gi }
  keycloak:
    requests: { cpu: 250m, memory: 768Mi }
    limits: { memory: 1536Mi }
  postgres:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

postgres:
  storageClass: standard
  storage: 2Gi

datagen:
  # ALS_LEEG: alleen data maken als de database leeg is (install/upgrade). reset-data.sh gebruikt ALTIJD.
  mode: ALS_LEEG
  jobName: bank-datagen
  # Bij reset-data.sh wordt de Job zonder Helm-hook toegepast.
  hook: true
