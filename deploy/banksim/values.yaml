# Worden door deploy/scripts/install.sh gezet.
imageTag: dev
certsChecksum: ""

images:
  api: banksim/bank-api
  bff: banksim/bank-bff
  migrate: banksim/bank-migrate
  web: banksim/bank-web
  keycloak: quay.io/keycloak/keycloak:26.8.0
  postgres: postgres:18.6-alpine

hosts:
  bank: bank.localtest.me
  auth: auth.localtest.me

ingress:
  className: nginx
  # Namespace van de bestaande ingress-nginx; alleen daarvandaan mag verkeer de namespace in.
  namespace: ingress-nginx

network:
  # Bronnen van kubelet-probes (node-IP), gezet door install.sh.
  probeSources: []

replicas:
  api: 2
  bff: 2
  web: 2

resources:
  api:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { memory: 512Mi }
  bff:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { memory: 512Mi }
  web:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 64Mi }
  migrate:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 384Mi }
  keycloak:
    requests: { cpu: 250m, memory: 768Mi }
    limits: { memory: 1536Mi }
  postgres:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

postgres:
  storageClass: standard
  storage: 2Gi

keycloak:
  # Testgebruiker voor fase 1; de echte klanten maakt bank-datagen aan.
  demoUser: demo
